[project]
name = "norway-open-data-pipeline"
version = "0.1.0"
description = "A production-style data pipeline for Norwegian open statistics from SSB."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Norway Open Data Pipeline" }
]
dependencies = [
  "httpx",
  "pandas",
  "pydantic-settings",
  "python-dotenv",
  "psycopg[binary]",
  "sqlalchemy",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
